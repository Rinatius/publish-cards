 return {canvas:cv,imgFailed:(!!s.img&&!imgOk)||artFailed};
}
const toBlob=cv=>new Promise(r=>cv.toBlob(r,'image/png'));
const crcT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=b=>{let c=~0;for(let i=0;i<b.length;i++)c=crcT[(c^b[i])&255]^(c>>>8);return ~c>>>0};
function zip(files){const parts=[],cen=[];let off=0;const enc=new TextEncoder();
 for(const f of files){const nm=enc.encode(f.name),crc=crc32(f.data),L=new DataView(new ArrayBuffer(30));
  L.setUint32(0,0x04034b50,true);L.setUint16(4,20,true);L.setUint32(14,crc,true);L.setUint32(18,f.data.length,true);L.setUint32(22,f.data.length,true);L.setUint16(26,nm.length,true);
  parts.push(L.buffer,nm,f.data);
  const C=new DataView(new ArrayBuffer(46));C.setUint32(0,0x02014b50,true);C.setUint16(4,20,true);C.setUint16(6,20,true);C.setUint32(16,crc,true);C.setUint32(20,f.data.length,true);C.setUint32(24,f.data.length,true);C.setUint16(28,nm.length,true);C.setUint32(42,off,true);
  cen.push(C.buffer,nm);off+=30+nm.length+f.data.length}
 const cs=cen.reduce((a,b)=>a+b.byteLength,0),E2=new DataView(new ArrayBuffer(22));E2.setUint32(0,0x06054b50,true);E2.setUint16(8,files.length,true);E2.setUint16(10,files.length,true);E2.setUint32(12,cs,true);E2.setUint32(16,off,true);
 return new Blob([...parts,...cen,E2.buffer],{type:'application/zip'})}
let dl;try{claude.use('downloads').then(d=>dl=d,()=>{})}catch(e){}
async function saveFile(name,blob){
 if(dl){try{await dl.save({filename:name,data:blob});return 'saved'}catch(e){if(e&&e.code==='declined')return 'declined'}}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);return 'saved'}
const msg=t=>$('expmsg').textContent=t;
async function prep(){try{await Promise.all(['800 40px "Bricolage Grotesque"','400 20px "DM Sans"','600 20px "DM Sans"'].map(f=>document.fonts.load(f)))}catch(e){}}
async function exportOne(){const c=all.cur,fmt=document.documentElement.dataset.f||'portrait',r=$('rail'),i=Math.min(c.slides.length-1,Math.round(r.scrollLeft/r.clientWidth));
 msg('Rendering…');await prep();const {canvas,imgFailed}=await renderSlide(c,i,fmt),b=await toBlob(canvas);
 const res=await saveFile(`${c.id}-${String(i+1).padStart(2,'0')}-${fmt}.png`,b);
 msg(res==='declined'?'Download canceled.':`Slide ${i+1} exported as ${FMT[fmt].w}×${FMT[fmt].h} PNG.`+(imgFailed?' The photo could not be loaded, so this slide has the plain colour background.':''))}
async function exportAll(){const c=all.cur,fmt=document.documentElement.dataset.f||'portrait';msg('Rendering…');await prep();const files=[],failed=[];
 for(let i=0;i<c.slides.length;i++){msg(`Rendering slide ${i+1} of ${c.slides.length}…`);const {canvas,imgFailed}=await renderSlide(c,i,fmt);if(imgFailed)failed.push(i+1);files.push({name:`${c.id}-${String(i+1).padStart(2,'0')}-${fmt}.png`,data:new Uint8Array(await (await toBlob(canvas)).arrayBuffer())})}
 const res=await saveFile(`${c.id}-${fmt}.zip`,zip(files));
 msg(res==='declined'?'Download canceled.':`${files.length} slides exported as ${FMT[fmt].w}×${FMT[fmt].h} PNGs in one zip.`+(failed.length?` The photo could not be loaded for slide${failed.length>1?'s':''} ${failed.join(', ')}; ${failed.length>1?'those have':'it has'} the plain colour background.`:''))}
$('exp1').onclick=()=>exportOne().catch(e=>msg('Export failed: '+e.message));
$('expAll').onclick=()=>exportAll().catch(e=>msg('Export failed: '+e.message));
</script>
